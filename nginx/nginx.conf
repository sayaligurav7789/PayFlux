events {
  worker_connections 1024;
}

http {
  # Round-robin across all three API containers by default -- Nginx
  # picks the next one in the list for each new request, so with
  # docker-compose exec logs open on all three, you can watch requests
  # actually land on different containers.
  upstream api_backend {
    server api1:4000;
    server api2:4000;
    server api3:4000;
  }

  server {
    listen 80;

    location /nginx-health {
      return 200 '{"status":"ok","service":"nginx"}';
      add_header Content-Type application/json;
    }

    location / {
      proxy_pass http://api_backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}